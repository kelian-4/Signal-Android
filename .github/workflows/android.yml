name: android

# Signal's original workflows were removed (see NOTICE.md). This one runs the unit-test battery of the
# offline core (frames, fragmentation, relay, outbox, identity, backup, QR verification, anti-abuse).
on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  offline-core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (offline-core)
        run: ./gradlew :lib:offline-core:test --no-daemon --stacktrace
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-core-test-report
          path: lib/offline-core/build/reports/tests/test
