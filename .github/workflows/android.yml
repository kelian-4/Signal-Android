name: android

# Signal's original workflows were removed (see NOTICE.md). This one runs the unit-test battery of the
# offline core (frames, fragmentation, relay, outbox, identity, backup, QR verification, anti-abuse).
on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  offline-core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (offline-core, offline-signal) and compile BLE module (offline-ble)
        run: |
          set -o pipefail
          ./gradlew :lib:offline-core:test :lib:offline-signal:test :lib:offline-ble:compileDebugKotlin --no-daemon --stacktrace 2>&1 | tee gradle.log
      - name: Expose Gradle errors as annotations
        if: failure()
        run: |
          {
            grep -nE "^e: |What went wrong|FAILURE|Could not|Unresolved|Execution failed" -A4 gradle.log | head -60
            echo "--- tail ---"; tail -n 30 gradle.log
          } > gradle-errors.txt || true
          msg=$(sed 's/%/%25/g' gradle-errors.txt | awk '{printf "%s%%0A", $0}' | cut -c1-6000)
          echo "::error title=gradle-log::$msg"
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-core-test-report
          path: |
            lib/offline-core/build/reports/tests/test
            lib/offline-signal/build/reports/tests/test
